# 매일 시즌 일정과 순위·기술 데이터를 갱신한다.
#   1. sync_season.py  공식 공지에 새 GO배틀리그 시즌이 올라오면 data/seasons.js 에 더한다
#   2. update_all.py   PvPoke·PoGoMate·게임 로케일에서 순위·기술·스프라이트를 다시 받는다
#   3. 테스트가 모두 통과할 때만 main 에 커밋한다
# 추정한 컵 id 나 공지와 달라진 주처럼 사람이 볼 것이 있으면 이슈를 연다(같은 내용이면 다시 열지 않는다).
# 잡이 실패하면(테스트 실패 등) '데이터 자동 갱신 실패' 이슈를 열고, 이미 열려 있으면 댓글을 단다.
name: 데이터 자동 갱신

on:
  schedule:
    - cron: '0 21 * * *'      # 매일 21:00 UTC = 한국시간 06:00 (주 교체 수요일 05:00/06:00 직후)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    # 다른 브랜치에서 손으로 돌려도 그 브랜치에 커밋하지 않게
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 시즌 일정 동기화
        # 공지 사이트 장애·모양 변경은 스크립트가 보고서에 적고 0 으로 끝난다. 그래도 죽으면 순위 갱신은 계속한다
        id: sync
        continue-on-error: true
        run: python pogo-cct-tool/scripts/sync_season.py --report "$RUNNER_TEMP/season-report.md"

      - name: 순위·기술·스프라이트 갱신
        # 경고(아직 순위가 없는 컵 등)로 끝나도 계속한다. 실제로 깨졌는지는 다음 단계 테스트가 본다
        run: python pogo-cct-tool/scripts/update_all.py || echo "::warning::update_all.py 가 경고로 끝났다 — 로그의 [경고] 확인"

      - name: 테스트
        run: |
          python tests/sync_season_test.py
          node tests/season.test.js
          node tests/formats.test.js
          node tests/battle-engine.test.js

      - name: 커밋·푸시
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          today=$(TZ=Asia/Seoul date +%F)
          if ! git diff --quiet -- data/seasons.js; then
            git add data/seasons.js
            git commit -m "시즌 일정을 공식 공지에서 자동으로 더한다 ($today)"
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "순위·기술 데이터를 자동으로 갱신한다 ($today)"
          fi
          git pull --rebase --quiet
          git push

      - name: 확인할 것 이슈로 남기기
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT="$RUNNER_TEMP/season-report.md"
          [ -s "$REPORT" ] || exit 0
          hash=$(sha1sum "$REPORT" | cut -c1-12)
          # 검색은 하이픈에서 낱말을 끊어서 쓰지 않는다 — 본문을 받아 직접 찾는다 (닫힌 이슈 포함)
          if gh issue list --state all --limit 300 --json body --jq '.[].body' | grep -qF "season-sync-$hash"; then
            echo "같은 내용의 이슈가 이미 있다 ($hash)"; exit 0
          fi
          { cat "$REPORT"; echo; echo "---"; echo "자동 갱신 확인 코드 season-sync-$hash"; } > "$RUNNER_TEMP/body.md"
          gh issue create --title "시즌 일정 자동 갱신 — 확인할 것 ($(TZ=Asia/Seoul date +%F))" --body-file "$RUNNER_TEMP/body.md"

      - name: 실패를 이슈로 남기기
        if: failure() || steps.sync.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "$(TZ=Asia/Seoul date '+%F %H:%M') 실행 중 실패가 있었다 — 시즌 동기화: ${{ steps.sync.outcome }}, 전체: ${{ job.status }}."
            echo "전체가 failure 면 아무것도 커밋되지 않았다 (다음 실행이 처음부터 다시 한다)."
            echo
            echo "로그: $run_url"
            REPORT="$RUNNER_TEMP/season-report.md"
            if [ -s "$REPORT" ]; then echo; echo "시즌 동기화 보고:"; echo; cat "$REPORT"; fi
          } > "$RUNNER_TEMP/fail.md"
          title='데이터 자동 갱신 실패'
          n=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file "$RUNNER_TEMP/fail.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/fail.md"
          fi
