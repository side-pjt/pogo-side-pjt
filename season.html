<script>
/* 이번 주·다음 주 포맷 순위 파일을 미리 읽는다 (상위 10종 표시용). format.js 와 같은 이유로 document.write */
(function () {
  const s = Season.at();
  const next = s.next || (s.nextSeason && s.nextSeason.weeks[0]);
  const keys = s.live.concat(next ? next.formats.map(Season.entry) : [])
    .filter(e => e.ready && e.key !== Format.key).map(e => e.key);
  [...new Set(keys)].forEach(k => document.write('<script src="data/formats/' + encodeURIComponent(k) + '.js"><\/script>'));
})();
</script>
